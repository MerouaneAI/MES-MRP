services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: erp
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DATABASE_URL: postgres://erp:${POSTGRES_PASSWORD}@db:5432/erp
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      STORAGE_DIR: /app/storage
    ports:
      - "3000:3000"
    volumes:
      - storage:/app/storage

  worker:
    build: .
    restart: unless-stopped
    command: ["npx", "tsx", "worker.ts"]
    depends_on:
      redis: { condition: service_started }
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://erp:${POSTGRES_PASSWORD}@db:5432/erp
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage

volumes:
  db_data:
  redis_data:
  storage:
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: erp
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgres://erp:${POSTGRES_PASSWORD}@db:5432/erp
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: app }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://erp:${POSTGRES_PASSWORD}@db:5432/erp
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: "true"
      STORAGE_DIR: /app/storage
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    volumes:
      - storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build: { context: ., target: worker }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://erp:${POSTGRES_PASSWORD}@db:5432/erp
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      migrate: { condition: service_completed_successfully }
    volumes:
      - storage:/app/storage

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  redis_data:
  storage:
  caddy_data:
  caddy_config: